<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}喫茶店 在庫管理{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('inventory.index') }}">喫茶店 在庫管理</a>
      {% if current_user.is_authenticated %}
        <nav aria-label="メインメニュー">
          <a href="{{ url_for('inventory.index') }}">在庫一覧</a>
          <a href="{{ url_for('inventory.history') }}">入出庫履歴</a>
          {% if current_user.role == "admin" %}
            <a href="{{ url_for('products.list_products') }}">商品管理</a>
          {% endif %}
          <span class="user-label">{{ current_user.username }}</span>
          <form action="{{ url_for('auth.logout') }}" method="post" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="button button-muted">ログアウト</button>
          </form>
        </nav>
      {% endif %}
    </header>
    <main class="container">
      {% for category, message in get_flashed_messages(with_categories=true) %}
        <div class="notice notice-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

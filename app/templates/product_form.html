{% extends "base.html" %}
{% block title %}{{ "商品編集" if product else "商品登録" }} | 喫茶店 在庫管理{% endblock %}
{% block content %}
  <section class="panel form-panel">
    <h1>{{ "商品編集" if product else "商品登録" }}</h1>
    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="code">商品コード</label>
      <input id="code" name="code" maxlength="40" value="{{ product.code if product else '' }}" required>
      <label for="name">商品名</label>
      <input id="name" name="name" maxlength="120" value="{{ product.name if product else '' }}" required>
      <label for="category">カテゴリ</label>
      <input id="category" name="category" maxlength="80" value="{{ product.category if product else '' }}" required>
      <label for="unit">単位</label>
      <input id="unit" name="unit" maxlength="24" value="{{ product.unit if product else '' }}" required>
      <label for="reorder_point">発注点</label>
      <input id="reorder_point" name="reorder_point" type="number" min="0" step="0.001" value="{{ product.reorder_point if product else '0.000' }}" required>
      {% if product %}
        <label class="checkbox-label"><input type="checkbox" name="is_active" {% if product.is_active %}checked{% endif %}> 有効な商品として扱う</label>
      {% endif %}
      <div class="button-row">
        <button class="button" type="submit">保存</button>
        <a class="button button-muted" href="{{ url_for('products.list_products') }}">戻る</a>
      </div>
    </form>
  </section>
{% endblock %}
